<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>한글공부</title>
<meta name="theme-color" content="#FFF7EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ─────────────── 홈 (텍스트 0개) ─────────────── -->
  <section class="screen" id="screen-home" data-screen="home">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <button class="parent-gate" id="btn-parent" aria-label="부모 메뉴">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5m7.43-2.53a7.7 7.7 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.6 7.6 0 0 0-1.68-.97l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.6 7.6 0 0 0-1.68.97l-2.39-.96a.5.5 0 0 0-.6.22L2.42 8.82a.5.5 0 0 0 .12.63l2.03 1.58a7.7 7.7 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.63l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.52.4 1.08.72 1.68.97l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.6-.25 1.16-.57 1.68-.97l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.63Z"/>
      </svg>
    </button>

    <!-- 단계 고르기 — 1 자모 · 2 글자 · 3 낱말 -->
    <div class="stage-bar" id="stage-bar"></div>

    <div class="home-main">
      <button class="big-start" id="btn-start" aria-label="오늘의 학습 시작">
        <span class="start-face" id="start-face"></span>
        <span class="btn-label">이어하기</span>
        <span class="start-pencil">
          <svg viewBox="0 0 64 64" width="86" height="86" aria-hidden="true">
            <path d="M12 52l3-11 27-27a5 5 0 0 1 7 0l1 1a5 5 0 0 1 0 7L23 49z" fill="#FFC86B" stroke="#7A5B2E" stroke-width="3" stroke-linejoin="round"/>
            <path d="M12 52l11-3-8-8z" fill="#7A5B2E"/>
            <path d="M39 17l8 8" stroke="#7A5B2E" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
    </div>

    <button class="book-btn" id="btn-book" aria-label="스티커북">
      <span class="book-icon">
        <svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
          <rect x="8" y="10" width="48" height="44" rx="6" fill="#FFF" stroke="#C9BCA8" stroke-width="3"/>
          <path d="M32 10v44" stroke="#C9BCA8" stroke-width="3"/>
          <circle cx="20" cy="24" r="5" fill="#FFD6E0"/>
          <circle cx="44" cy="24" r="5" fill="#BFE8DC"/>
          <circle cx="20" cy="40" r="5" fill="#DCD3F5"/>
          <circle cx="44" cy="40" r="5" fill="#FFE9A8"/>
        </svg>
      </span>
      <span class="btn-label small">스티커</span>
      <span class="book-count" id="book-count"></span>
    </button>

    <button class="pick-btn" id="btn-pick" aria-label="글자 고르기">
      <span class="pick-letters"><b>ㄱ</b><b>ㄴ</b><b>ㄷ</b></span>
      <span class="btn-label small">글자 고르기</span>
    </button>

    <button class="restart-btn" id="btn-restart" aria-label="처음부터 하기" hidden>
      <span class="btn-label small">처음하기</span>
      <span class="restart-icon">
        <svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true">
          <rect x="14" y="17" width="7" height="30" rx="3.5" fill="#7A5B2E"/>
          <path d="M48 17 L48 47 L27 32 Z" fill="#FFC86B" stroke="#7A5B2E" stroke-width="3.5" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
  </section>

  <!-- ─────────────── 학습 세션 ─────────────── -->
  <section class="screen" id="screen-session" data-screen="session">
    <div class="session-top">
      <button class="session-home" id="btn-escape" aria-label="홈으로">
        <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
          <path d="M32 10 L56 32 h-7v20H15V32H8z" fill="#FFD86B" stroke="#7A5B2E"
            stroke-width="3.5" stroke-linejoin="round"/>
          <rect x="27" y="38" width="10" height="14" rx="2" fill="#7A5B2E"/>
        </svg>
      </button>
      <div class="progress-dots" id="progress-dots"></div>
      <button class="redo-btn" id="btn-redo" aria-label="다시 쓰기">
        <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
          <path d="M50 32a18 18 0 1 1-5.3-12.7" fill="none" stroke="#7A5B2E"
            stroke-width="6" stroke-linecap="round"/>
          <path d="M46 8v14H32z" fill="#7A5B2E"/>
        </svg>
      </button>
      <button class="demo-btn" id="btn-demo" aria-label="시범 보기">
        <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
          <path d="M14 44c8-22 28-22 36 0" fill="none" stroke="#7A5B2E" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/>
          <circle cx="14" cy="44" r="6" fill="#4CB8A0"/>
          <path d="M44 40l8 4-6 6z" fill="#7A5B2E"/>
        </svg>
      </button>
    </div>
    <canvas id="trace-canvas"></canvas>
    <div class="letter-word" id="letter-word"></div>
    <div class="fx-layer" id="fx-layer"></div>
  </section>

  <!-- ─────────────── 보상 연출 ─────────────── -->
  <section class="screen" id="screen-reward" data-screen="reward"></section>

  <!-- ─────────────── 글자 고르기 ─────────────── -->
  <section class="screen" id="screen-pick" data-screen="pick"></section>

  <!-- ─────────────── 스티커북 ─────────────── -->
  <section class="screen" id="screen-book" data-screen="book"></section>

  <!-- ─────────────── 부모 메뉴 ─────────────── -->
  <section class="screen" id="screen-parent" data-screen="parent"></section>

</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
